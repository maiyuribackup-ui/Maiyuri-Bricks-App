name: My Work accountability nudges

# Three schedules, one route (mode picked from which cron fired):
#   nag       — every 2h, 09:30–17:30 IST (04:00–12:00 UTC): re-push open
#               items due today/overdue until acted on; >4h overdue escalates
#               once to founder/owner + Telegram.
#   evening   — 18:00 IST (12:30 UTC): "not finished today" summary per person.
#   scorecard — Monday 08:00 IST (02:30 UTC Mon): weekly completion % → Telegram.

on:
  schedule:
    - cron: "0 4,6,8,10,12 * * *" # nag (work hours IST)
    - cron: "30 12 * * *" # evening chaser 6pm IST
    - cron: "30 2 * * 1" # scorecard Monday 8am IST
  workflow_dispatch:
    inputs:
      mode:
        description: "nag | evening | scorecard"
        required: true
        default: "nag"

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Pick mode from trigger
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 2 * * 1" ]; then
            echo "mode=scorecard" >> "$GITHUB_OUTPUT"
          else
            echo "mode=nag" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nudges
        run: |
          set -o pipefail
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 75 --retry 1 --retry-delay 2 \
            -o /tmp/r.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mb.maiyuri.com/api/my-work/nudges?mode=${{ steps.mode.outputs.mode }}")
          echo "HTTP $status (mode=${{ steps.mode.outputs.mode }})"
          cat /tmp/r.json || true
          if [ "$status" -ge 400 ] || [ "$status" = "000" ]; then exit 1; fi

      - name: Alert on repeated failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_alert=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_alert=1
          else
            recent_failures=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "my-work-nudges.yml" \
              --status completed \
              --limit 2 \
              --json conclusion \
              --jq '[.[].conclusion] | map(select(. == "failure")) | length' 2>/dev/null || echo 0)
            echo "Recent completed failures before this run: ${recent_failures}"
            if [ "${recent_failures}" -ge 2 ]; then
              should_alert=1
            fi
          fi

          if [ "$should_alert" != "1" ]; then
            echo "Suppressing failure alert until repeated failures are observed."
            exit 0
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="❌ ${{ github.workflow }} failed repeatedly: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
