name: Process OS engine (SQL)

# Runs the plpgsql engine suites against a throwaway Postgres whenever the
# Process OS migration, its tests, or the reference definition change.

on:
  pull_request:
    paths:
      - "supabase/migrations/20260912100000_process_os.sql"
      - "supabase/migrations/20260912110000_process_role_default_holders.sql"
      - "supabase/migrations/20260913100000_process_qc_releases.sql"
      - "supabase/migrations/20260711000001_my_work.sql"
      - "supabase/migrations/20260718120000_work_item_nudges.sql"
      - "supabase/migrations/20260903120000_lead_stage_progression_tasks.sql"
      - "supabase/tests/process_os/**"
      - "apps/web/src/lib/process/definitions/**"
      - "packages/shared/src/process.ts"
      - ".github/workflows/process-os-sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260912100000_process_os.sql"
      - "supabase/migrations/20260913100000_process_qc_releases.sql"
      - "supabase/tests/process_os/**"
      - "apps/web/src/lib/process/definitions/**"
  workflow_dispatch: {}

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (bun-locked)
        run: bun install --frozen-lockfile
      - name: Scaffold + migrations
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/process_os/00_scaffold.sql
          $P -c "CREATE SCHEMA storage; CREATE TABLE storage.buckets (id TEXT PRIMARY KEY, name TEXT, public BOOLEAN, file_size_limit BIGINT, allowed_mime_types TEXT[]);"
          for f in 20260711000001_my_work 20260718120000_work_item_nudges 20260903120000_lead_stage_progression_tasks 20260912100000_process_os 20260912110000_process_role_default_holders 20260913100000_process_qc_releases; do
            $P -f supabase/migrations/$f.sql
          done
      - name: Smoke + negative suites
        run: |
          set -e
          out=$(psql -v ON_ERROR_STOP=1 -f supabase/tests/process_os/10_smoke.sql 2>&1); echo "$out"
          echo "$out" | grep -q "UNEXPECTED SUCCESS" && exit 1
          out=$(psql -v ON_ERROR_STOP=1 -f supabase/tests/process_os/20_negative.sql 2>&1); echo "$out"
          echo "$out" | grep -q "UNEXPECTED SUCCESS" && exit 1
          echo "smoke + negative OK"
      - name: Golden scenarios A–E on the real Lead-to-Delivery definition
        run: |
          set -e
          def=$(cd apps/web && bun scripts/dump-process-definition.ts LEAD_TO_DELIVERY)
          out=$(psql -v ON_ERROR_STOP=1 -v def="$def" -f supabase/tests/process_os/30_golden.sql 2>&1); echo "$out"
          echo "$out" | grep -q "UNEXPECTED SUCCESS" && exit 1
          echo "$out" | grep -q "GOLDEN OK"
