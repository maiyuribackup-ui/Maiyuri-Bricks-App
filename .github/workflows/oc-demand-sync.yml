name: Ops Control demand sync

# Pulls ALL open Odoo sales orders into oc_sales_order_lines (paginated,
# classified, applied atomically — see src/lib/ops-control/odoo-demand.ts).
# 00:20 UTC = 05:50 IST, right after the nightly Odoo sync at 00:15 so both
# read the same morning state. GitHub workflow, not a Vercel cron (Hobby caps
# crons at 2, both used by health + recordings).

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger demand sync
        run: |
          status=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mb.maiyuri.com/api/ops-control/sales-orders/sync")
          echo "HTTP $status"; head -c 500 /tmp/r.json
          if [ "$status" -ge 400 ]; then exit 1; fi

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
