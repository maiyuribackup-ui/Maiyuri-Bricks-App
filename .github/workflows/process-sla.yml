name: Process OS SLA sweep

# Hourly: warn assignees as a stage approaches its SLA and escalate breaches
# (push + Telegram). Idempotent — the database records what already fired.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger process SLA sweep
        run: |
          status=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mb.maiyuri.com/api/cron/process-sla")
          echo "HTTP $status"; cat /tmp/r.json
          if [ "$status" -ge 400 ]; then exit 1; fi

      - name: Alert on failure
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
